name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (SQLite, data in ${{ matrix.data }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        data: [db, files]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FUSE
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3
      - name: Format and vet
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
      - name: Test
        env:
          TUPLEFS_REQUIRE_FUSE: "1" # fail, do not skip, if a mount is impossible
          TUPLEFS_TEST_DATA: ${{ matrix.data }}
        run: go test -race ./...

  postgres:
    name: test (PostgreSQL, data in ${{ matrix.data }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        data: [db, files]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tuplefs
          POSTGRES_DB: tuplefs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FUSE
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3
      - name: Test
        env:
          TUPLEFS_REQUIRE_FUSE: "1"
          TUPLEFS_TEST_DATA: ${{ matrix.data }}
          TUPLEFS_TEST_POSTGRES: postgres://postgres:tuplefs@127.0.0.1:5432/tuplefs?sslmode=disable
        run: go test -p 1 ./internal/...

  passthrough:
    name: test (root, kernel passthrough required)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FUSE
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3
      - name: Test as root
        run: |
          uname -r
          sudo env "PATH=$PATH" TUPLEFS_REQUIRE_FUSE=1 TUPLEFS_TEST_DATA=files TUPLEFS_REQUIRE_PASSTHROUGH=1 \
            go test -v -run 'TestPassthrough|TestMount|TestKill' ./internal/fusefs/ ./cmd/tuplefs/

  conformance:
    name: POSIX conformance (pjdfstest, data in ${{ matrix.data }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        data: [db, files]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FUSE and build tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3 autoconf automake build-essential
      - name: Build pjdfstest
        run: |
          git clone --depth 1 https://github.com/pjd/pjdfstest /tmp/pjdfstest
          cd /tmp/pjdfstest && autoreconf -ifs && ./configure && make pjdfstest
      - name: Mount tuplefs as root
        run: |
          go build -o /tmp/tuplefs ./cmd/tuplefs
          echo user_allow_other | sudo tee -a /etc/fuse.conf
          sudo mkdir -p /mnt/tuplefs
          sudo /tmp/tuplefs mkfs -data ${{ matrix.data }} /tmp/fs.db
          sudo /tmp/tuplefs mount -allow-other /tmp/fs.db /mnt/tuplefs &
          for i in $(seq 1 50); do mountpoint -q /mnt/tuplefs && break; sleep 0.2; done
          mountpoint /mnt/tuplefs
      - name: Run pjdfstest
        run: |
          cd /mnt/tuplefs
          sudo prove -r /tmp/pjdfstest/tests 2>&1 | tee /tmp/pjdfstest.log | tail -n 80
          {
            echo '### pjdfstest, data in ${{ matrix.data }}'
            echo '```'
            tail -n 40 /tmp/pjdfstest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -q '^Result: PASS' /tmp/pjdfstest.log
      - name: Check the file system afterwards
        if: always()
        run: |
          sudo fusermount3 -u /mnt/tuplefs
          sleep 3
          sudo /tmp/tuplefs fsck /tmp/fs.db

  benchmark:
    name: benchmark (same runner, same disk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install FUSE
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fuse3
      - name: Run
        run: |
          set -o pipefail
          go build -o /tmp/tuplefs ./cmd/tuplefs
          sudo mkdir -p /mnt/bench/local /mnt/bench/mnt
          {
            echo "kernel $(uname -r), $(nproc) CPUs, $(df -T /mnt/bench | tail -1 | awk '{print $2}')"
            echo "===== local directory"
            sudo bench/bench.sh /mnt/bench/local
            for layout in db files; do
              sudo rm -rf /mnt/bench/fs.db*
              sudo /tmp/tuplefs mkfs -data $layout /mnt/bench/fs.db >/dev/null
              sudo sh -c '/tmp/tuplefs mount /mnt/bench/fs.db /mnt/bench/mnt 2>/tmp/mount.log &'
              for i in $(seq 1 50); do sudo mountpoint -q /mnt/bench/mnt && break; sleep 0.2; done
              # Refuse to measure anything that is not a tuplefs mount.
              sudo findmnt -n -o FSTYPE /mnt/bench/mnt | grep -qx fuse.tuplefs || { cat /tmp/mount.log; exit 1; }
              echo "===== tuplefs on SQLite, data in $layout, mounted as root"
              sudo bench/bench.sh /mnt/bench/mnt
              sudo fusermount3 -u /mnt/bench/mnt; sleep 3
              sudo /tmp/tuplefs fsck /mnt/bench/fs.db
            done
          } 2>&1 | tee /tmp/bench.txt
          { echo '```'; cat /tmp/bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
